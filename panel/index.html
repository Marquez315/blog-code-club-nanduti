<!doctype html>
<html lang="es" data-theme="norton" data-chrome="term"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1C2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blog Retro · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;family=Playfair+Display:ital,wght@0,700;0,900;1,700&amp;family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&amp;family=Special+Elite&amp;display=swap" rel="stylesheet">
<style>
:root{
  --danger:#B8281F;
  --f-px:'Press Start 2P','Courier New',monospace;
  --f-body:'VT323','Courier New',ui-monospace,monospace;
}
/* ===== Temas de época (10 estilos) ===== */
html[data-theme="consola"]{
  --bg:#D5D0DD; --panel:#EFEDF4; --ink:#2A2733; --ink2:#5B566B;
  --a1:#6A4FB3; --a2:#D6403A; --a3:#F0B429; --a4:#3E9B6B; --a5:#3D6FD6; --on-a:#FFFFFF; --on-a3:#2A2733;
  --screen:#1E1C2B; --screen-ink:#ECE9F7;
}
html[data-theme="gameboy"]{
  --bg:#9BBC0F; --panel:#B5D02B; --ink:#0F380F; --ink2:#306230;
  --a1:#306230; --a2:#0F380F; --a3:#8BAC0F; --a4:#306230; --a5:#0F380F; --on-a:#9BBC0F; --on-a3:#0F380F;
  --screen:#0F380F; --screen-ink:#9BBC0F;
}
html[data-theme="arcade"]{
  --bg:#150F2E; --panel:#241B4F; --ink:#F4F1FF; --ink2:#B9B0E8;
  --a1:#FF3EA5; --a2:#29E3F2; --a3:#FFD23F; --a4:#7CFF6B; --a5:#8B6BFF; --on-a:#150F2E; --on-a3:#150F2E;
  --screen:#0B0720; --screen-ink:#F4F1FF;
}
html[data-theme="nanduti"]{
  --bg:#0F4C55; --panel:#FFFFFF; --ink:#12313A; --ink2:#4B6770;
  --a1:#E63946; --a2:#2A9D8F; --a3:#F4B942; --a4:#8E5CF2; --a5:#0F4C55; --on-a:#FFFFFF; --on-a3:#12313A;
  --screen:#12313A; --screen-ink:#FFFFFF;
}
html[data-theme="norton"]{
  --bg:#0000AA; --panel:#0000AA; --ink:#FFFFFF; --ink2:#55FFFF;
  --a1:#FFFF55; --a2:#FF5555; --a3:#55FFFF; --a4:#55FF55; --a5:#FFFFFF; --on-a:#0000AA; --on-a3:#0000AA;
  --screen:#000000; --screen-ink:#55FF55;
  --f-px:'VT323','Courier New',monospace; --f-body:'VT323','Courier New',monospace;
}
html[data-theme="msdos"]{
  --bg:#0000AA; --panel:#AAAAAA; --ink:#000000; --ink2:#444444;
  --a1:#0000AA; --a2:#AA0000; --a3:#AAAA00; --a4:#00AA00; --a5:#00AAAA; --on-a:#FFFFFF; --on-a3:#FFFFFF;
  --screen:#0000AA; --screen-ink:#FFFFFF;
  --f-px:'VT323','Courier New',monospace; --f-body:'VT323','Courier New',monospace;
}
html[data-theme="fosforo"]{
  --bg:#001100; --panel:#001A00; --ink:#33FF33; --ink2:#1FAA1F;
  --a1:#33FF33; --a2:#0FCB0F; --a3:#7CFF7C; --a4:#22CC22; --a5:#55FF55; --on-a:#001100; --on-a3:#001100;
  --screen:#000000; --screen-ink:#33FF33;
  --f-px:'VT323','Courier New',monospace; --f-body:'VT323','Courier New',monospace;
}
html[data-theme="ambar"]{
  --bg:#150900; --panel:#1F0D00; --ink:#FFB000; --ink2:#CC8800;
  --a1:#FFB000; --a2:#FF8800; --a3:#FFD060; --a4:#E0A000; --a5:#FFC040; --on-a:#150900; --on-a3:#150900;
  --screen:#000000; --screen-ink:#FFB000;
  --f-px:'VT323','Courier New',monospace; --f-body:'VT323','Courier New',monospace;
}
html[data-theme="win31"]{
  --bg:#008080; --panel:#C0C0C0; --ink:#000000; --ink2:#444444;
  --a1:#000080; --a2:#800000; --a3:#808000; --a4:#008000; --a5:#000080; --on-a:#FFFFFF; --on-a3:#FFFFFF;
  --screen:#000080; --screen-ink:#FFFFFF; --bv-lt:#FFFFFF; --bv-dk:#404040;
  --f-px:Tahoma,'Segoe UI',Arial,sans-serif; --f-body:Tahoma,'Segoe UI',Arial,sans-serif;
}
html[data-theme="hotdog"]{
  --bg:#FF0000; --panel:#FFFF00; --ink:#000000; --ink2:#5C3B00;
  --a1:#FF0000; --a2:#000000; --a3:#FFFFFF; --a4:#FFA500; --a5:#FF0000; --on-a:#FFFFFF; --on-a3:#000000;
  --screen:#000000; --screen-ink:#FFFF00; --bv-lt:#FFFFFF; --bv-dk:#800000;
  --f-px:Tahoma,'Segoe UI',Arial,sans-serif; --f-body:Tahoma,'Segoe UI',Arial,sans-serif;
}
html[data-theme="diario90"]{
  --bg:#DCD3B8; --panel:#F4EFDC; --ink:#221C14; --ink2:#5B5240;
  --a1:#7A1717; --a2:#1B3A5C; --a3:#C7A54A; --a4:#3B5B3A; --a5:#221C14; --on-a:#F4EFDC; --on-a3:#221C14;
  --screen:#171310; --screen-ink:#E7DEC0; --bv-lt:#F4EFDC; --bv-dk:#8A7F61;
  --f-px:'Playfair Display',Georgia,'Times New Roman',serif;
  --f-body:'PT Serif',Georgia,'Times New Roman',serif;
  --f-type:'Special Elite','Courier New',monospace;
}
html[data-theme="revista90"]{
  --bg:#F3ECDD; --panel:#FFFFFF; --ink:#1A1A1A; --ink2:#6B6558;
  --a1:#FF2D78; --a2:#00AEEF; --a3:#FFC300; --a4:#7B2CBF; --a5:#1A1A1A; --on-a:#FFFFFF; --on-a3:#1A1A1A;
  --screen:#1A1A1A; --screen-ink:#FFC300;
  --f-px:'Press Start 2P','Courier New',monospace;
  --f-body:'VT323','Courier New',ui-monospace,monospace;
  --f-type:'VT323','Courier New',monospace;
}
html[data-theme="comic"]{
  --bg:#FFE067; --panel:#FFFFFF; --ink:#0B0B0B; --ink2:#3A3A3A;
  --a1:#E63946; --a2:#1D4ED8; --a3:#FFD60A; --a4:#2A9D34; --a5:#0B0B0B; --on-a:#FFFFFF; --on-a3:#0B0B0B;
  --screen:#0B0B0B; --screen-ink:#FFD60A;
  --f-px:'Press Start 2P','Courier New',monospace;
  --f-body:'VT323','Courier New',ui-monospace,monospace;
  --f-type:'VT323','Courier New',monospace;
}
/* ===== Chasis por época (bordes/relieve) ===== */
[data-chrome="term"] .px,[data-chrome="term"] .btn,[data-chrome="term"] .icon,[data-chrome="term"] .steps>li,[data-chrome="term"] .banner,[data-chrome="term"] .sw,[data-chrome="term"] .in,[data-chrome="term"] textarea.in,[data-chrome="term"] select.in{
  border-width:4px;border-style:double;box-shadow:none
}
[data-chrome="term"] .pill{border-width:4px;border-style:double}
[data-chrome="term"] .btn:hover:not([disabled]){transform:none;box-shadow:none;filter:brightness(1.15)}
[data-chrome="term"] .btn:active:not([disabled]){transform:none;box-shadow:none;filter:brightness(.85)}
[data-chrome="term"] .sw[aria-pressed="true"]{box-shadow:none;outline:3px solid var(--a1);outline-offset:2px}
[data-chrome="bevel"] .px,[data-chrome="bevel"] .btn,[data-chrome="bevel"] .icon,[data-chrome="bevel"] .steps>li,[data-chrome="bevel"] .banner,[data-chrome="bevel"] .sw,[data-chrome="bevel"] .in,[data-chrome="bevel"] textarea.in,[data-chrome="bevel"] select.in{
  border-width:2px;border-style:solid;border-color:var(--bv-lt) var(--bv-dk) var(--bv-dk) var(--bv-lt);box-shadow:none
}
[data-chrome="bevel"] .btn:hover:not([disabled]){transform:none}
[data-chrome="bevel"] .btn:active:not([disabled]),[data-chrome="bevel"] .sw[aria-pressed="true"]{border-color:var(--bv-dk) var(--bv-lt) var(--bv-lt) var(--bv-dk);transform:none}
[data-chrome="paper"] .px,[data-chrome="paper"] .icon,[data-chrome="paper"] .steps>li,[data-chrome="paper"] .banner,[data-chrome="paper"] .sw,[data-chrome="paper"] .in,[data-chrome="paper"] textarea.in,[data-chrome="paper"] select.in{
  border-width:1px;border-style:solid;box-shadow:0 3px 10px rgba(20,14,4,.25)
}
[data-chrome="paper"] .pill{border-width:1px;border-style:solid}
[data-chrome="paper"] .btn{border:2px dashed var(--a1);background:transparent;color:var(--a1);box-shadow:none;font-family:var(--f-type);text-transform:uppercase;letter-spacing:.05em}
[data-chrome="paper"] .btn.c2{border-color:var(--a2);color:var(--a2)}
[data-chrome="paper"] .btn.c3{border-color:var(--on-a3);color:var(--ink);background:rgba(199,165,74,.18)}
[data-chrome="paper"] .btn.plain{border-style:solid;color:var(--ink);border-color:var(--ink)}
[data-chrome="paper"] .btn:hover:not([disabled]){transform:translateY(-1px);box-shadow:none;filter:none;background:rgba(34,28,20,.06)}
[data-chrome="paper"] .btn:active:not([disabled]){transform:translateY(1px) scale(.97);box-shadow:none;filter:none}
[data-chrome="paper"] .sw[aria-pressed="true"]{box-shadow:none;outline:3px solid var(--a1);outline-offset:2px}
[data-chrome="mag"] .px,[data-chrome="mag"] .icon,[data-chrome="mag"] .steps>li,[data-chrome="mag"] .banner,[data-chrome="mag"] .sw,[data-chrome="mag"] .in,[data-chrome="mag"] textarea.in,[data-chrome="mag"] select.in{
  border-width:0;box-shadow:0 6px 14px rgba(0,0,0,.16)
}
[data-chrome="mag"] .pill{border-width:0}
[data-chrome="mag"] .btn{border:0;border-radius:999px;background:var(--a1);color:var(--on-a);font-family:var(--f-type);text-transform:uppercase;letter-spacing:.05em;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.25)}
[data-chrome="mag"] .btn.c2{background:var(--a2)}
[data-chrome="mag"] .btn.c3{background:var(--a3);color:var(--on-a3)}
[data-chrome="mag"] .btn.plain{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.12)}
[data-chrome="mag"] .btn:hover:not([disabled]){transform:translateY(-2px)}
[data-chrome="mag"] .btn:active:not([disabled]){transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
[data-chrome="mag"] .sw[aria-pressed="true"]{box-shadow:none;outline:3px solid var(--a1);outline-offset:2px;border-radius:6px}
[data-chrome="comic"] .px,[data-chrome="comic"] .icon,[data-chrome="comic"] .steps>li,[data-chrome="comic"] .banner,[data-chrome="comic"] .sw,[data-chrome="comic"] .in,[data-chrome="comic"] textarea.in,[data-chrome="comic"] select.in{
  border-width:3px;border-style:solid;border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)
}
[data-chrome="comic"] .pill{border-width:2px;border-style:solid;border-color:var(--ink)}
[data-chrome="comic"] .btn{border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:var(--f-px);letter-spacing:.02em;text-transform:uppercase}
[data-chrome="comic"] .btn:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
[data-chrome="comic"] .btn:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
[data-chrome="comic"] .sw[aria-pressed="true"]{box-shadow:4px 4px 0 var(--ink);outline:2px solid var(--ink);outline-offset:1px}
[data-scan="1"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
[data-scan="1"] .px-title{text-shadow:0 0 6px currentColor}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 22px/1.28 var(--f-body);min-height:100vh;
  padding:0 env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button[disabled]{cursor:default;opacity:.4}
a{color:var(--a1)}
:focus-visible{outline:3px solid var(--a1);outline-offset:2px}
.top :focus-visible,.overlay .dlg.dark :focus-visible{outline-color:var(--a3)}
img{max-width:100%;display:block}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
svg{display:block}

/* ===== piezas ===== */
.px{border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:var(--panel)}
.scan{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px)}
.px-title{font-family:var(--f-px);line-height:1.5;letter-spacing:.02em;text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:7px 16px;border:3px solid var(--ink);background:var(--a1);color:var(--on-a);
  box-shadow:4px 4px 0 var(--ink);font-size:23px;line-height:1.05;text-decoration:none;transition:transform .06s,box-shadow .06s;min-height:44px}
.btn:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active:not([disabled]){transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn.c2{background:var(--a2)}.btn.c3{background:var(--a3);color:var(--on-a3)}.btn.c4{background:var(--a4)}.btn.c5{background:var(--a5)}
.btn.plain{background:var(--panel);color:var(--ink)}
.btn.sm{padding:3px 11px;font-size:21px;min-height:36px;box-shadow:3px 3px 0 var(--ink)}
.btn.block{width:100%}
.btn svg{width:16px;height:16px;fill:currentColor}
.icon{width:38px;height:38px;border:3px solid var(--ink);background:var(--panel);display:grid;place-items:center;color:var(--ink);flex:none}
.icon:hover:not([disabled]){background:var(--a3)}
.icon svg{width:16px;height:16px;fill:currentColor}
.icon.danger:hover:not([disabled]){background:var(--a2);color:#fff}
.pill{display:inline-flex;align-items:center;gap:8px;padding:0 10px;border:2px solid var(--ink);background:var(--panel);font-size:20px}
.pill i{width:10px;height:10px;background:var(--ink2);display:block}
.pill.ok i{background:var(--a4)}.pill.warn i{background:var(--a3)}.pill.bad i{background:var(--a2)}
.muted{color:var(--ink2)}
code{background:#fff;border:2px solid var(--ink);padding:0 6px;font-size:.95em;overflow-wrap:anywhere}
.small{font-size:20px}

/* ===== barra ===== */
.top{position:sticky;top:0;z-index:20;background:var(--screen);color:var(--screen-ink);border-bottom:4px solid var(--ink);padding:env(safe-area-inset-top,0) 14px 0}
.top-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:56px}
.logo{display:flex;align-items:center;gap:12px;font:400 12px/1.4 var(--f-px);white-space:nowrap;background:none;color:inherit}
.logo svg{width:28px;height:28px}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:6px 12px;color:var(--screen-ink);font-size:22px;white-space:nowrap;border:2px solid transparent}
.nav button:hover{border-color:var(--screen-ink)}
.nav button[aria-current="page"]{background:var(--screen-ink);color:var(--screen)}
.who{display:flex;align-items:center;gap:8px;font-size:20px;color:var(--screen-ink);opacity:.85;white-space:nowrap}
.who img{width:26px;height:26px;border:2px solid var(--screen-ink)}

.wrap{max-width:1000px;margin:0 auto;padding:22px 14px 60px}
.center{max-width:640px;margin:0 auto}
.stack>*+*{margin-top:22px}
.card{padding:20px}
.card h2.px-title{font-size:13px;margin-bottom:14px}
.hero{padding:26px 22px}
.hero h1{font-size:clamp(15px,3.6vw,22px);margin-bottom:12px}
.hero p{font-size:24px;max-width:46ch}

/* ===== pasos ===== */
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps>li{position:relative;padding:14px 14px 14px 62px;border:3px solid var(--ink);background:var(--panel);box-shadow:4px 4px 0 var(--ink);margin-bottom:16px}
.steps>li::before{counter-increment:s;content:counter(s);position:absolute;left:12px;top:12px;width:36px;height:36px;display:grid;place-items:center;background:var(--a3);color:var(--on-a3);border:3px solid var(--ink);font:400 14px var(--f-px)}
.steps>li:nth-child(2)::before{background:var(--a2);color:#fff}
.steps>li:nth-child(3)::before{background:var(--a4);color:#fff}
.steps h3{font-size:25px;margin-bottom:4px}
.steps p{color:var(--ink2)}
.steps .btn{margin-top:10px}

/* ===== formularios ===== */
label.lbl{display:block;font-size:22px;margin:0 0 5px}
.hint{color:var(--ink2);font-size:20px;margin-top:4px}
.in,textarea.in,select.in{width:100%;border:3px solid var(--ink);background:#fff;color:var(--ink);padding:7px 10px;font-size:23px;border-radius:0;outline:0;min-height:44px}
.in:focus{border-color:var(--a1);box-shadow:3px 3px 0 var(--a1)}
textarea.in{resize:none;line-height:1.25;display:block;min-height:96px}
.field+.field{margin-top:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:22px}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--a1);flex:none}
.err{color:var(--danger);font-size:21px;margin-top:6px}
.okmsg{color:#1E7A4D}
.banner{border:3px solid var(--ink);padding:12px 14px;background:var(--a3);color:var(--on-a3);box-shadow:4px 4px 0 var(--ink);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner .grow{flex:1;min-width:200px}
.banner.info{background:var(--panel);color:var(--ink)}

/* ===== tema ===== */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-height:60vh;overflow-y:auto;padding-right:2px}
.sw{display:block;text-align:left;border:3px solid var(--ink);background:var(--panel);padding:10px}
.sw .cols{display:flex;height:26px;border:2px solid var(--ink);margin-bottom:8px}
.sw .cols i{flex:1}
.sw b{display:block;font-weight:400;font-size:23px;line-height:1}
.sw small{color:var(--ink2);font-size:19px;line-height:1.1;display:block;margin-top:3px}
.sw[aria-pressed="true"]{background:var(--a3);box-shadow:4px 4px 0 var(--ink)}
.sw[aria-pressed="true"] small{color:var(--on-a3)}

/* ===== panel: blog ===== */
.bloghead{display:flex;gap:16px 24px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.bloghead h1{font-size:clamp(14px,3vw,20px);margin-bottom:8px}
.urlrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.urlrow a{overflow-wrap:anywhere}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 14px;flex-wrap:wrap}
.sec-head h2{font-size:13px}
.plist{display:flex;flex-direction:column;gap:14px}
.prow{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;padding:10px}
.prow .th{width:84px;height:84px;border:3px solid var(--ink);background:var(--screen);overflow:hidden;display:grid;place-items:center;color:var(--screen-ink);font:400 22px var(--f-px)}
.prow .th img{width:100%;height:100%;object-fit:cover}
.prow h3{font-size:26px;line-height:1.05;overflow-wrap:anywhere}
.prow .meta{color:var(--ink2);font-size:20px;margin-top:4px}
.prow .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:34px 20px;text-align:center}
.empty p{font-size:25px;margin:14px 0 20px}

/* ===== editor ===== */
.ed-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.ed-head h1{font-size:14px}
.titlein{font-size:30px!important;padding:10px 12px!important;line-height:1.1}
.tagbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:3px solid var(--ink);background:#fff;padding:6px 8px;min-height:48px}
.tagbox:focus-within{border-color:var(--a1);box-shadow:3px 3px 0 var(--a1)}
.tagbox input{flex:1;min-width:120px;border:0;outline:0;background:none;font-size:23px;padding:2px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--a1);color:#fff;padding:0 4px 0 10px;border:2px solid var(--ink);font-size:21px}
.tag button{width:22px;height:22px;display:grid;place-items:center;color:#fff}
.tag svg{width:10px;height:10px;fill:currentColor}
.blocks>*+*{margin-top:18px}
.blk{border:3px solid var(--ink);background:var(--panel);box-shadow:4px 4px 0 var(--ink)}
.bhead{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;background:var(--screen);color:var(--screen-ink);border-bottom:3px solid var(--ink)}
.btype{flex:1;font:400 11px var(--f-px);line-height:1.6}
.bhead .icon{width:32px;height:32px;background:var(--screen);color:var(--screen-ink);border-color:var(--screen-ink)}
.bhead .icon:hover:not([disabled]){background:var(--a3);color:var(--on-a3)}
.bhead .icon.danger:hover:not([disabled]){background:var(--a2);color:#fff}
.bbody{padding:12px}
.fmt{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.fmt button{border:2px solid var(--ink);background:#fff;min-width:38px;height:34px;font-size:22px;padding:0 10px}
.fmt button:hover{background:var(--a3)}
.fmt span{color:var(--ink2);font-size:19px;margin-left:4px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.thumb{border:3px solid var(--ink);background:#fff;position:relative}
.thumb .img{aspect-ratio:1;background:var(--screen);overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.cover{border-color:var(--a3);box-shadow:0 0 0 3px var(--ink)}
.ribbon{position:absolute;left:0;top:0;background:var(--a3);color:var(--on-a3);border:2px solid var(--ink);border-width:0 2px 2px 0;font:400 8px var(--f-px);padding:5px 7px}
.tctl{display:flex;gap:4px;padding:6px;border-top:3px solid var(--ink);background:var(--panel)}
.tctl .icon{width:32px;height:32px;border-width:2px}
.thumb input.in{border-width:0;border-top:3px solid var(--ink);font-size:20px;min-height:38px;padding:4px 8px}
.thumb input.in:focus{box-shadow:none}
.addphoto{border:3px dashed var(--ink2);min-height:180px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;padding:14px;text-align:center;color:var(--ink2)}
.addphoto.drag{background:var(--a3);color:var(--on-a3);border-color:var(--ink)}
.addbar{border:3px dashed var(--ink2);padding:14px;text-align:center}
.addbar h3{font:400 11px var(--f-px);margin-bottom:12px;color:var(--ink2);line-height:1.6}
.addbar .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.actionbar{position:sticky;bottom:0;z-index:10;margin:26px -14px 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--screen);border-top:4px solid var(--ink);display:flex;gap:12px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.actionbar .msg{flex:1;color:var(--screen-ink);font-size:20px;min-width:140px}

/* ===== ayuda ===== */
.guide h2{font-size:12px;margin:0 0 12px;line-height:1.7}
.guide details{border:3px solid var(--ink);background:var(--panel);margin-bottom:12px;box-shadow:4px 4px 0 var(--ink)}
.guide summary{padding:12px 14px;cursor:pointer;font-size:25px;list-style:none;display:flex;gap:10px;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide summary::before{content:"+";display:grid;place-items:center;width:26px;height:26px;background:var(--a1);color:#fff;border:2px solid var(--ink);font:400 14px var(--f-px);flex:none}
.guide details[open] summary::before{content:"-"}
.guide .cont{padding:4px 16px 16px;border-top:3px solid var(--ink)}
.guide .cont p,.guide .cont li{font-size:23px;margin-top:10px}
.guide .cont ol,.guide .cont ul{padding-left:24px;margin:0}
.guide code{background:#fff;border:2px solid var(--ink);padding:0 6px;font-size:.95em;overflow-wrap:anywhere}

/* ===== modales ===== */
.overlay{position:fixed;inset:0;background:rgba(20,16,36,.72);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.dlg{width:min(520px,100%);padding:20px;max-height:100%;overflow:auto}
.dlg h2{font:400 13px/1.6 var(--f-px);margin-bottom:12px}
.dlg p{font-size:23px}
.dlg .btns{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.pl{list-style:none;margin:14px 0 0;padding:0}
.pl li{display:flex;gap:12px;align-items:flex-start;padding:5px 0;font-size:23px;line-height:1.15}
.pl li i{width:18px;height:18px;flex:none;margin-top:3px;border:3px solid var(--ink);background:#fff}
.pl li.run i{background:var(--a3);animation:blink .8s steps(2) infinite}
.pl li.ok i{background:var(--a4)}
.pl li.err i{background:var(--a2)}
.pl li.wait{color:var(--ink2)}
@keyframes blink{50%{opacity:.35}}
.prev{position:fixed;inset:0;z-index:70;background:var(--screen);display:flex;flex-direction:column}
.prev-bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:4px solid var(--ink);color:var(--screen-ink);flex-wrap:wrap}
.prev-bar .sp{flex:1}
.prev-bar .btn{box-shadow:3px 3px 0 #000}
.prev-body{flex:1;display:flex;justify-content:center;background:#0d0b16;overflow:auto;padding:14px}
.prev-body iframe{border:4px solid var(--screen-ink);background:#fff;width:100%;height:100%;min-height:400px}
.prev-body.phone iframe{width:390px;max-width:100%}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--screen);color:var(--screen-ink);border:3px solid var(--screen-ink);padding:6px 16px;z-index:90;font-size:22px;max-width:92vw;text-align:center;pointer-events:none}
.loading{text-align:center;padding:70px 0;font:400 12px/2 var(--f-px)}
.loading span{animation:blink 1s steps(2) infinite}

@media (max-width:640px){
  body{font-size:21px}
  .who span{display:none}
  .logo span{display:none}
  .row2{grid-template-columns:1fr}
  .prow{grid-template-columns:64px 1fr}
  .prow .th{width:64px;height:64px}
  .prow .btns{grid-column:1/-1;justify-content:flex-start}
  .thumbs{grid-template-columns:repeat(2,1fr);gap:10px}
  .wrap{padding:16px 12px 50px}
  .actionbar{margin:22px -12px 0;padding-left:12px;padding-right:12px}
  .actionbar .btn{flex:1}
  .titlein{font-size:26px!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

async function blobToB64(blob){ const buf=new Uint8Array(await blob.arrayBuffer()); let s=''; for(let i=0;i<buf.length;i+=0x8000) s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000)); return btoa(s); }

/* ---------- cliente de GitHub ---------- */
class GHError extends Error { constructor(status,msg,extra){ super(msg||''); this.status=status; this.extra=extra||{}; } }
const GH = {
  token:'',
  async req(method, path, body, opts={}){
    let url = path.startsWith('http') ? path : API + path;
    if (method==='GET') url += (url.includes('?')?'&':'?') + '_=' + Date.now();
    const headers = { Authorization:'Bearer '+GH.token, Accept: opts.accept || 'application/vnd.github+json' };
    if (body!==undefined) headers['Content-Type'] = 'application/json';
    let res;
    try { res = await fetch(url, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined }); }
    catch(e){ throw new GHError(0,'network'); }
    if (res.status===204) return { status:204, data:null, res };
    let data=null; const ct=res.headers.get('content-type')||'';
    if (opts.raw && res.ok) data = await res.text();
    else if (ct.includes('json')) data = await res.json().catch(()=>null);
    else data = await res.text().catch(()=>null);
    if (!res.ok) throw new GHError(res.status, (data && data.message) || res.statusText, { data, remaining: res.headers.get('x-ratelimit-remaining') });
    return { status:res.status, data, res };
  }
};
function errText(e){
  if (!(e instanceof GHError)) return (e && e.message) ? e.message : 'Ocurrió un error inesperado.';
  switch (e.status) {
    case 0: return 'No hay conexión con GitHub. Revisá tu internet y probá de nuevo.';
    case 401: return 'GitHub no aceptó tu llave de acceso (venció o fue borrada). Creá una nueva y volvé a conectarte.';
    case 403: return e.extra.remaining==='0' ? 'GitHub pidió esperar un rato por demasiados pedidos. Probá de nuevo en unos minutos.' : 'Tu llave no tiene permiso para hacer esto. Al crearla, tenés que tildar la casilla "repo".';
    case 404: return 'No se encontró lo que buscábamos. Puede que el repositorio no exista o que tu llave no tenga acceso.';
    case 409: return 'Alguien más guardó cambios al mismo tiempo. Probá de nuevo.';
    case 413: return 'El archivo es demasiado grande.';
    case 422: return 'GitHub rechazó los datos: ' + (e.message || 'revisá lo que escribiste') + '.';
    default: return 'GitHub respondió con un error (' + e.status + '). ' + (e.message||'');
  }
}

/* ---------- API de contenido ---------- */
async function getFile(path){
  const q = `?ref=${encodeURIComponent(state.blog.branch)}`;
  try {
    const { data } = await GH.req('GET', `${rp()}/contents/${encPath(path)}${q}`);
    if (Array.isArray(data)) return null;
    let text;
    if (data.encoding==='base64' && data.content) text = b64ToText(data.content);
    else { const r = await GH.req('GET', `${rp()}/contents/${encPath(path)}${q}`, undefined, { accept:'application/vnd.github.raw+json', raw:true }); text = r.data; }
    return { sha:data.sha, text };
  } catch(e){ if (e.status===404) return null; throw e; }
}
async function upsertFile(path, b64, message, sha){
  let lastErr;
  for (let i=0;i<5;i++){
    try {
      const body = { message, content:b64, branch:state.blog.branch };
      if (sha) body.sha = sha;
      return await GH.req('PUT', `${rp()}/contents/${encPath(path)}`, body);
    } catch(e){
      lastErr = e;
      if (e.status===404 && state.blog.fresh && i<3){ await sleep(1500); continue; }
      if (e.status===409 || e.status===422){
        if (e.status===409) await sleep(900);
        const cur = await getFile(path).catch(()=>null);
        if (cur && cur.sha!==sha){ sha = cur.sha; continue; }
        if (e.status===409) continue;
      }
      throw e;
    }
  }
  throw lastErr;
}
async function readJson(path, fallback){
  const f = await getFile(path);
  if (!f) return { sha:null, data:fallback };
  try { return { sha:f.sha, data:JSON.parse(f.text) }; } catch(e){ return { sha:f.sha, data:fallback }; }
}
async function writeJson(path, obj, sha, message){
  return upsertFile(path, textToB64(JSON.stringify(obj, null, 2)+'\n'), message, sha);
}
async function deleteFiles(paths){
  const byDir = {};
  paths.forEach(p => { const i=p.lastIndexOf('/'); const d=p.slice(0,i); (byDir[d]=byDir[d]||[]).push(p); });
  for (const dir of Object.keys(byDir)){
    let list;
    try { ({ data:list } = await GH.req('GET', `${rp()}/contents/${encPath(dir)}?ref=${encodeURIComponent(state.blog.branch)}`)); }
    catch(e){ if (e.status===404) continue; throw e; }
    for (const p of byDir[dir]){
      const it = (list||[]).find(x => x.path===p);
      if (!it) continue;
      try { await GH.req('DELETE', `${rp()}/contents/${encPath(p)}`, { message:'Borrar imagen', sha:it.sha, branch:state.blog.branch }); }
      catch(e){ /* se ignora: la imagen queda huérfana, no rompe nada */ }
    }
  }
}

/* ---------- imágenes ---------- */
async function loadBitmap(file){
  try { return await createImageBitmap(file, { imageOrientation:'from-image' }); }
  catch(e){
    return await new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('No pudimos leer esa imagen. Probá con una foto JPG o PNG.')); im.src=u; });
  }
}
async function processImage(file, opts={}){
  const max = opts.max || 1600, square = opts.square || 0;
  const bmp = await loadBitmap(file);
  const w = bmp.naturalWidth || bmp.width, h = bmp.naturalHeight || bmp.height;
  let sx=0, sy=0, sw=w, sh=h, dw, dh;
  if (square){ const s=Math.min(w,h); sx=(w-s)/2; sy=(h-s)/2; sw=sh=s; dw=dh=Math.min(square,s); }
  else { const k=Math.min(1, max/Math.max(w,h)); dw=Math.max(1,Math.round(w*k)); dh=Math.max(1,Math.round(h*k)); }
  const c = document.createElement('canvas'); c.width=dw; c.height=dh;
  const ctx = c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,dw,dh); ctx.drawImage(bmp, sx,sy,sw,sh, 0,0,dw,dh);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
  if (!blob) throw new Error('No pudimos procesar esa imagen.');
  return { blob, url:URL.createObjectURL(blob) };
}

class Progress {
  constructor(title, labels){
    this.labels = labels.slice(); this.st = labels.map(()=> 'wait');
    this.title = title; this.extra = ''; this.foot = '';
    this.draw();
  }
  draw(){
    showModal(`<h2>${esc(this.title)}</h2><ul class="pl">${this.labels.map((l,i)=>`<li class="${this.st[i]}"><i></i><span>${esc(l)}</span></li>`).join('')}</ul>${this.extra?`<p style="margin-top:14px">${this.extra}</p>`:''}${this.foot}`);
  }
  run(i, label){ this.st[i]='run'; if(label) this.labels[i]=label; this.draw(); }
  ok(i, label){ this.st[i]='ok'; if(label) this.labels[i]=label; this.draw(); }
  err(i){ this.st[i]='err'; this.draw(); }
  finish(html, buttons){
    this.extra = html; this.foot = `<div class="btns">${buttons}</div>`; this.draw();
    return new Promise(res => { $('#modal').onclick = e => { const b=e.target.closest('[data-r]'); if(b){ closeModal(); res(b.dataset.r); } }; });
  }
}

function coverPath(p){

function collabSectionHTML(){
  if (!state.blog || state.blog.owner.toLowerCase() !== state.user.login.toLowerCase()) return '';
  const c = state.collab || { loading:true, list:[], invites:[], err:'' };
  let rows = '';
  if (c.loading){
    rows = '<p class="muted small">Cargando colaboradores…</p>';
  } else if (c.err){
    rows = `<p class="err" style="display:block">${esc(c.err)}</p>`;
  } else if (!c.list.length && !c.invites.length){
    rows = '<p class="muted small">Todavía no invitaste a nadie. Podés invitar a otro docente o alumno para que cree entradas junto con vos.</p>';
  } else {
    rows = '<div class="stack" style="--g:10px">' +
      c.list.map(u => `<div class="prow px" style="grid-template-columns:auto 1fr auto;align-items:center;gap:12px">
        <img src="${esc(u.avatar_url||'')}" alt="" style="width:36px;height:36px;border-radius:50%;background:var(--panel)">
        <div><b>${esc(u.login)}</b><div class="meta">Puede crear y editar entradas</div></div>
        <button class="btn sm plain" data-act="remove-collab" data-user="${esc(u.login)}">Quitar</button>
      </div>`).join('') +
      c.invites.map(inv => `<div class="prow px" style="grid-template-columns:1fr auto;align-items:center;gap:12px">
        <div><b>${esc((inv.invitee && inv.invitee.login) || '?')}</b><div class="meta">Invitación pendiente</div></div>
        <button class="btn sm plain" data-act="cancel-invite" data-id="${esc(String(inv.id))}">Cancelar</button>
      </div>`).join('') +
      '</div>';
  }
  return `<section class="card px"><h2 class="px-title">COLABORADORES</h2>
    <p class="muted" style="margin-bottom:12px">Invitá a otra persona para que también pueda crear y editar entradas en este blog. Necesita tener una cuenta de GitHub; le va a llegar una invitación que tiene que aceptar antes de poder usar el panel acá.</p>
    <form id="collabForm" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px" autocomplete="off">
      <input class="in" id="collabUser" placeholder="usuario de GitHub" style="flex:1;min-width:160px" spellcheck="false" autocapitalize="off">
      <button class="btn sm c4" type="submit">Invitar</button>
    </form>
    <div class="err" id="collabErr" hidden></div>
    ${rows}
  </section>`;
}
async function loadCollaborators(){
  if (!state.blog || state.blog.owner.toLowerCase() !== state.user.login.toLowerCase()) return;
  state.collab = { loading:true, list:[], invites:[], err:'' };
  try {
    const [collabRes, invRes] = await Promise.all([
      GH.req('GET', `${rp()}/collaborators?affiliation=direct&per_page=100`),
      GH.req('GET', `${rp()}/invitations?per_page=100`)
    ]);
    const list = (collabRes.data||[]).filter(u => u.login.toLowerCase() !== state.blog.owner.toLowerCase());
    state.collab = { loading:false, list, invites:invRes.data||[], err:'' };
  } catch(e){
    state.collab = { loading:false, list:[], invites:[], err:errText(e) };
  }
  if (state.view==='settings') render();
}
async function inviteCollaboratorAction(raw){
  const username = String(raw||'').trim().replace(/^@/, '');
  const err = $('#collabErr');
  if (!username){ if (err){ err.textContent='Escribí un usuario de GitHub.'; err.hidden=false; } return; }
  if (username.toLowerCase() === state.blog.owner.toLowerCase()){ if (err){ err.textContent='Ese usuario ya es el dueño del blog.'; err.hidden=false; } return; }
  if (err) err.hidden = true;
  try {
    await GH.req('PUT', `${rp()}/collaborators/${encodeURIComponent(username)}`, { permission:'push' });
    toast(`Invitación enviada a ${username}`);
    const inp = $('#collabUser'); if (inp) inp.value = '';
    loadCollaborators();
  } catch(e){
    if (err){ err.textContent = (e instanceof GHError && e.status===404) ? 'No encontramos a ese usuario en GitHub. Revisá cómo está escrito.' : errText(e); err.hidden = false; }
  }
}
async function removeCollaboratorAction(username){
  try {
    await GH.req('DELETE', `${rp()}/collaborators/${encodeURIComponent(username)}`);
    toast(`Se quitó a ${username} del blog`);
    loadCollaborators();
  } catch(e){ toast(errText(e)); }
}
async function cancelInviteAction(id){
  try {
    await GH.req('DELETE', `${rp()}/invitations/${id}`);
    toast('Invitación cancelada');
    loadCollaborators();
  } catch(e){ toast(errText(e)); }
}

/* ---------- Editor ---------- */
function newEditor(){
  return { mode:'new', id:'', title:'', date:today(), tags:[], blocks:[ mkBlock('text') ], coverUid:null, dirty:false, tagDraft:'', orig:null, restored:false };
}
function mkBlock(type){
  const b = { uid:uid(), type };
  if (type==='photos') b.images = [];
  else if (type==='link'){ b.label=''; b.url=''; }
  else if (type==='video'){ b.url=''; }
  else b.text = '';
  return b;
}
function editorFromPost(p){
  const ed = newEditor(); ed.mode='edit'; ed.id=p.id; ed.title=p.title||''; ed.date=p.date||today(); ed.tags=(p.tags||[]).slice(); ed.orig=p; ed.blocks=[];
  (p.blocks||[]).forEach(b => {
    const nb = mkBlock(b.type);
    if (b.type==='photos') nb.images = (b.images||[]).map(im => ({ uid:uid(), src:im.src, caption:im.caption||'', blob:null, preview:'' }));
    else if (b.type==='link'){ nb.label=b.label||''; nb.url=b.url||''; }
    else if (b.type==='video'){ nb.url=b.url||''; }
    else nb.text = b.text||'';
    ed.blocks.push(nb);
  });
  if (p.cover){ for (const b of ed.blocks) if (b.images) for (const im of b.images) if (im.src===p.cover) ed.coverUid = im.uid; }
  if (!ed.blocks.length) ed.blocks.push(mkBlock('text'));
  return ed;
}
function allImages(ed){ const r=[]; ed.blocks.forEach(b => { if (b.images) b.images.forEach(im => r.push(im)); }); return r; }
function effCover(ed){ const ims=allImages(ed); if (ims.find(i=>i.uid===ed.coverUid)) return ed.coverUid; return ims.length?ims[0].uid:null; }
const draftKey = ed => `rb.draft:${state.blog.owner}/${state.blog.repo}:${ed.mode==='edit'?ed.id:'new'}`;

function blockHTML(b, i, n){
  const ctl = `<span class="btype">${esc(BLOCK_NAMES[b.type])}</span>

/* construir el post a partir del editor */
function cleanBlocks(ed, srcOf){
  const out = [];
  ed.blocks.forEach(b => {
    if (b.type==='text' || b.type==='heading' || b.type==='callout'){ const t=(b.text||'').trim(); if (t) out.push({ type:b.type, text:t }); }
    else if (b.type==='photos'){ const ims=b.images.map(im=>({ src:srcOf(im), caption:(im.caption||'').trim() })).filter(i=>i.src); if (ims.length) out.push({ type:'photos', images:ims }); }
    else if (b.type==='video'){ const u=(b.url||'').trim(); if (u) out.push({ type:'video', url:u }); }
    else if (b.type==='link'){ const u=(b.url||'').trim(); if (u) out.push({ type:'link', label:(b.label||'').trim()||u, url:u }); }
  });
  return out;
}
function summaryOf(blocks){ const t = blocks.find(b=>b.type==='text'); return t ? t.text.replace(/\s+/g,' ').slice(0,160) : ''; }

function guarded(fn){
  return async (...a) => {
    if (state.busy) return;
    state.busy = true;
    try { return await fn(...a); }
    catch(e){
      closeModal();
      if (e instanceof GHError && e.status===401){ await notice('Sesión vencida', esc(errText(e))); doLogout(); }
      else await notice('Algo salió mal', esc(errText(e)));
    }
    finally { state.busy = false; }
  };
}
function doLogout(){
  LS.del('rb.token'); LS.del('rb.blog'); GH.token=''; Object.assign(state,{ token:'', user:null, blog:null, site:null, posts:[], blogs:[], ed:null, pages:null, settingsDraft:null });
  setView('connect');
}

async function connect(token, silent){
  GH.token = token;
  const { data, res } = await GH.req('GET', '/user');
  const scopes = res.headers.get('x-oauth-scopes');
  if (scopes!==null && !/(^|,\s*)(repo|public_repo)(\s*,|$)/.test(scopes)){
    throw new GHError(403, 'Falta el permiso repo', {});
  }
  state.token = token; state.user = { login:data.login, avatar:data.avatar_url, name:data.name };
  const saved = LS.get('rb.blog', null);
  if (saved && saved.owner){ try { await openBlog(saved.owner, saved.repo, true); return; } catch(e){ LS.del('rb.blog'); } }
  const hint = hostedHint();
  if (hint){ try { await openBlog(hint.owner, hint.repo, true); return; } catch(e){} }
  await loadBlogList();
  setView('blogs');
}
function hostedHint(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i); if (!m) return null;
  const seg = location.pathname.split('/').filter(Boolean)[0];
  const repo = (seg && seg!=='panel') ? seg : m[1]+'.github.io';
  return { owner:m[1], repo };
}
async function loadBlogList(){
  const { data } = await GH.req('GET', '/user/repos?per_page=100&sort=updated&affiliation=owner,collaborator');
  state.blogs = (data||[]).filter(r => (r.topics||[]).includes('retro-blog')).map(r => ({ owner:r.owner.login, name:r.name, url:siteUrlFor(r.owner.login, r.name) }));
}
async function openBlog(owner, repo, silent){
  const { data:r } = await GH.req('GET', `/repos/${owner}/${repo}`);
  if (r.permissions && !r.permissions.push) throw new Error('Tu cuenta no tiene permiso para editar ese repositorio. Pedile al dueño que te invite como colaborador.');
  state.blog = { owner:r.owner.login, repo:r.name, branch:r.default_branch || 'main', url:siteUrlFor(r.owner.login, r.name), fresh:false };
  state.blog.panelUrl = state.blog.url + 'panel/';
  let sj = await readJson('data/site.json', null);
  if (!sj.data){
    if (silent){ state.blog = null; throw new Error('no-blog'); }
    const yes = await ask({ title:'Convertir en blog', text:'Ese repositorio todavía no es un blog retro. ¿Querés instalar el diseño y los archivos necesarios? No se borra nada de lo que ya tiene.', ok:'Sí, convertir' });
    if (!yes){ state.blog = null; return; }
    await installBlogFiles({ title:r.name, subtitle:'', author:'', bio:'', theme:'diario90', links:[] }, false);
    sj = await readJson('data/site.json', null);
    await GH.req('PUT', `${rp()}/topics`, { names:Array.from(new Set([...(r.topics||[]), 'retro-blog'])) }).catch(()=>{});
  }
  state.site = sj.data;
  const pj = await readJson('data/posts.json', { version:1, posts:[] });
  state.posts = (pj.data && pj.data.posts) || [];
  LS.set('rb.blog', { owner:state.blog.owner, repo:state.blog.repo });
  state.pages = null; state.settingsDraft = null; state.collab = null;
  setView('dashboard');
  refreshPages();
}
async function refreshPages(){
  try {
    const { data } = await GH.req('GET', `${rp()}/pages`);
    state.pages = { status: data.status || 'building', url: data.html_url };
  } catch(e){ state.pages = e.status===404 ? { status:'off' } : { status:'building' }; }
  const row = $('#pagesRow'); if (row && state.view==='dashboard') row.innerHTML = pagesPill();
}
async function enablePages(){
  try { await GH.req('POST', `${rp()}/pages`, { source:{ branch:state.blog.branch, path:'/' } }); return true; }
  catch(e){ if (e.status===409) return true; return false; }
}

/* instala index.html, .nojekyll, data/*.json y opcionalmente el panel */
async function installBlogFiles(site, withPanel, pr, base){
  const msg = 'Blog Retro: instalar diseño';
  let i = base || 0;
  const step = (n) => pr && pr.run(n);
  const done = (n) => pr && pr.ok(n);
  step(i); await upsertFile('index.html', textToB64(TEMPLATE), msg); await upsertFile('.nojekyll', textToB64('\n'), msg); done(i); i++;
  step(i);
  const cur = await readJson('data/site.json', null);
  const merged = Object.assign({ version:1 }, cur.data || {}, site, { templateVersion:TEMPLATE_VERSION, updated:Date.now() });
  await writeJson('data/site.json', merged, cur.sha, 'Blog Retro: configuración');
  const pj = await readJson('data/posts.json', null);
  if (!pj.data) await writeJson('data/posts.json', { version:1, posts:[] }, null, 'Blog Retro: entradas');
  state.site = merged; done(i); i++;
  if (withPanel){ step(i); await upsertFile('panel/index.html', textToB64(SELF_HTML), 'Blog Retro: panel web'); done(i); i++; }
  return i;
}

const savePostAction = guarded(async () => {
  const ed = state.ed;
  const title = ed.title.trim();
  if (!title){ await notice('Falta el título', 'Escribí un título para la entrada.'); $('#edTitle') && $('#edTitle').focus(); return; }
  // sumar el tema que quedó escrito sin Enter
  if (ed.tagDraft.trim()) addTag(ed.tagDraft);
  const newImgs = allImages(ed).filter(im => im.blob && !im.src);
  if (!ed.id){
    const base = `${ed.date}-${slug(title)||'entrada'}`; let id = base, n = 2;
    while (state.posts.some(p => p.id===id)) id = `${base}-${n++}`;
    ed.id = id;
  }
  const labels = [];
  if (newImgs.length) labels.push(`Subiendo fotos (0 de ${newImgs.length})`);
  labels.push('Guardando la entrada');
  const orig = ed.orig ? Array.from(new Set([...(ed.orig.cover?[ed.orig.cover]:[]), ...(ed.orig.blocks||[]).flatMap(b=>b.type==='photos'?b.images.map(i=>i.src):[])])) : [];
  const newPathsPlanned = new Set(allImages(ed).filter(i=>i.src).map(i=>i.src));
  const removed = orig.filter(p => !newPathsPlanned.has(p));
  if (removed.length) labels.push('Limpiando fotos que ya no se usan');
  const pr = new Progress(ed.mode==='new'?'Publicando tu entrada':'Guardando cambios', labels);
  let li = 0;
  try {
    if (newImgs.length){
      pr.run(0);
      for (let k=0;k<newImgs.length;k++){
        const im = newImgs[k];
        const path = `images/${ed.id}/${Date.now().toString(36)}-${k+1}.jpg`;
        pr.labels[0] = `Subiendo fotos (${k} de ${newImgs.length})`; pr.draw();
        await upsertFile(path, await blobToB64(im.blob), 'Foto para: ' + title);
        im.src = path; im.uploaded = true;
      }
      pr.ok(0, `Fotos subidas (${newImgs.length})`); li = 1;
    }
    pr.run(li);
    const cov = effCover(ed); const covImg = allImages(ed).find(i => i.uid===cov);
    const blocks = cleanBlocks(ed, im => im.src);
    const post = { id:ed.id, title, date:ed.date||today(), tags:ed.tags.slice(), cover: covImg && covImg.src ? covImg.src : '', summary:summaryOf(blocks), blocks, created: ed.orig ? (ed.orig.created||Date.now()) : Date.now(), updated:Date.now() };
    const cur = await readJson('data/posts.json', { version:1, posts:[] });
    const list = (cur.data && cur.data.posts) || [];
    const at = list.findIndex(p => p.id===post.id);
    if (at>=0) list[at] = post; else list.unshift(post);
    await writeJson('data/posts.json', { version:1, posts:list }, cur.sha, (ed.mode==='new'?'Nueva entrada: ':'Editar entrada: ') + title);
    state.posts = list; pr.ok(li); li++;
    if (removed.length){ pr.run(li); await deleteFiles(removed.filter(p => !blocks.some(b=>b.images && b.images.some(i=>i.src===p)) && p!==post.cover)); pr.ok(li); }
  } catch(e){ closeModal(); throw e; }
  LS.del(draftKey(ed)); ed.dirty = false;
  await pr.finish(`<b>¡Listo!</b> Tu entrada ya está guardada. En la web puede tardar hasta un minuto en verse.`, `<button class="btn c4" data-r="ok">Volver a mis entradas</button>`);
  state.ed = null; setView('dashboard');
});

  const html = TEMPLATE.replace('<body>', () => '<body>' + inj);
  const box = document.createElement('div'); box.className = 'prev';
  box.innerHTML = `<div class="prev-bar"><b class="px-title" style="font-size:11px">VISTA PREVIA</b><button class="btn sm ${'c3'}" data-pv="phone">Celular</button><button class="btn sm plain" data-pv="desk">Compu</button><span class="sp"></span><button class="btn sm c2" data-pv="close">Cerrar</button></div><div class="prev-body phone"><iframe title="Vista previa" sandbox="allow-scripts allow-popups"></iframe></div>`;
  document.body.appendChild(box);
  box.querySelector('iframe').srcdoc = html;
  box.onclick = e => {
    const b = e.target.closest('[data-pv]'); if (!b) return;
    if (b.dataset.pv==='close'){ box.remove(); return; }
    box.querySelector('.prev-body').classList.toggle('phone', b.dataset.pv==='phone');
    box.querySelectorAll('[data-pv="phone"],[data-pv="desk"]').forEach(x => { x.className = 'btn sm ' + (x.dataset.pv===b.dataset.pv?'c3':'plain'); });
  };
});

/* ==========================================================================
   Eventos
   ========================================================================== */
function addTag(raw){
  const ed = state.ed;
  String(raw).split(',').forEach(t => {
    t = t.trim().replace(/\s+/g,' ').slice(0,30);
    if (t && ed.tags.length<8 && !ed.tags.some(x => x.toLowerCase()===t.toLowerCase())) ed.tags.push(t);
  });
  ed.tagDraft = ''; ed.dirty = true;
}
function findBlock(uidv){ return state.ed.blocks.find(b => b.uid===uidv); }
function rerenderEditor(scrollToUid){
  const y = window.scrollY; root.innerHTML = viewEditor(); afterEditorRender(); window.scrollTo(0,y);
  if (scrollToUid){ const el = document.querySelector(`[data-blk="${scrollToUid}"]`); if (el) el.scrollIntoView({ block:'center' }); }
  scheduleDraft();
}
let photoTarget = null;
async function handleFiles(files){
  const b = photoTarget && findBlock(photoTarget); photoTarget = null;
  if (!b || !files || !files.length) return;
  const list = Array.from(files).filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|gif|webp|heic|heif|avif|bmp)$/i.test(f.name));
  if (!list.length){ toast('Elegí archivos de imagen'); return; }
  let ok = 0, fail = 0;
  for (let i=0;i<list.length;i++){
    toast(`Preparando fotos (${i+1} de ${list.length})…`, 8000);
    try { const r = await processImage(list[i]); b.images.push({ uid:uid(), src:'', blob:r.blob, preview:r.url, caption:'' }); ok++; }
    catch(e){ fail++; }
  }
  state.ed.dirty = true;
  toast(fail ? `${ok} foto(s) listas. ${fail} no se pudieron leer (probá con JPG o PNG).` : `${ok} foto(s) lista(s)`);
  rerenderEditor();
}
$('#fileIn').addEventListener('change', e => { handleFiles(e.target.files); e.target.value=''; });
$('#camIn').addEventListener('change', e => { handleFiles(e.target.files); e.target.value=''; });
$('#avatarIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value=''; if (!f) return;
  try {
    readSettingsForm();
    const r = await processImage(f, { square:400 });
    const s = state.settingsDraft; if (!s._oldAvatar) s._oldAvatar = state.site.avatar || '';
    s._avatarBlob = r.blob; s._avatarPreview = r.url; s._avatarRemoved = false; render();
  } catch(err){ toast(errText(err)); }
});

const actions = {
  'go-home'(){ setView(state.blog ? 'dashboard' : (state.user ? 'blogs' : 'connect')); },
  'nav'(el){ leaveEditorThen(() => { if (el.dataset.v==='settings') state.settingsDraft = null; setView(el.dataset.v); }); },
  'logout'(){ ask({ title:'Salir', text:'Se borra la llave guardada de este dispositivo. Tu blog no se toca.', ok:'Salir' }).then(y => { if (y) doLogout(); }); },
  'switch-blog'(){ leaveEditorThen(async () => { LS.del('rb.blog'); state.blog=null; state.site=null; state.posts=[]; state.collab=null; try { await loadBlogList(); } catch(e){} setView('blogs'); }); },
  'pick-theme'(el){
    const g = el.dataset.group;
    document.querySelectorAll(`[data-group="${g}"]`).forEach(x => x.setAttribute('aria-pressed', x===el ? 'true':'false'));
    if (g==='cThemes') state.createTheme = el.dataset.theme;
    else if (g==='uiThemes'){ applyUiTheme(el.dataset.theme); LS.set('rb.uiTheme', el.dataset.theme); }
    else { readSettingsForm(); state.settingsDraft.theme = el.dataset.theme; }
  },
  'ui-theme'(){ showModal(`<h2 class="px-title" style="font-size:14px;margin-bottom:14px">ESTILO DEL PANEL</h2><p class="muted" style="margin-bottom:14px">Elegí cómo se ve esta app en tu dispositivo. No afecta el estilo de tu blog público, que se elige aparte en "Mi blog".</p>${themePicker(state.uiTheme,'uiThemes')}<div style="margin-top:16px;text-align:right"><button class="btn plain sm" data-act="close-modal">Cerrar</button></div>`); },
  'close-modal'(){ closeModal(); },
  'open-blog'(el){ openBlogGuarded(el.dataset.owner, el.dataset.repo); },
  'copy-url'(){ copyText(state.blog.url); },
  'check-pages'(){ toast('Revisando…'); refreshPages(); },
  'enable-pages'(){ enablePagesAction(); },
  'update-design'(){ updateDesignAction(); },
  'install-panel'(){ installPanelAction(); },
  'backup'(){
    const data = JSON.stringify({ site:state.site, posts:state.posts }, null, 2);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type:'application/json' })); a.download = `copia-${state.blog.repo}-${today()}.json`; a.click();
  },
  'new-post'(){ state.ed = newEditor(); setView('editor'); },
  'edit-post'(el){ const p = state.posts.find(x => x.id===el.dataset.id); if (p){ state.ed = editorFromPost(p); setView('editor'); } },
  'del-post'(el){ deletePostAction(el.dataset.id); },
  'ed-back'(){ leaveEditorThen(() => setView('dashboard')); },
  'draft-restore'(){
    const d = LS.get(draftKey(state.ed), null); if (!d) return;
    const ed = state.ed; ed.title = d.title||''; ed.date = d.date||ed.date; ed.tags = d.tags||[]; ed.dirty = true; ed.restored = true;
    ed.blocks = (d.blocks||[]).map(b => { const nb = mkBlock(b.type); if (b.type==='photos') nb.images=(b.images||[]).map(i=>({ uid:uid(), src:i.src, caption:i.caption||'', blob:null, preview:'' })); else Object.assign(nb, b, { uid:nb.uid }); return nb; });
    if (!ed.blocks.length) ed.blocks = [mkBlock('text')];
    rerenderEditor(); toast('Borrador recuperado');
  },
  'draft-drop'(){ LS.del(draftKey(state.ed)); state.ed.restored = true; $('#draftBanner').innerHTML=''; },
  'tag-del'(el){ state.ed.tags.splice(+el.dataset.i,1); state.ed.dirty=true; rerenderEditor(); },
  'add-block'(el){ const b = mkBlock(el.dataset.type); state.ed.blocks.push(b); state.ed.dirty=true; rerenderEditor(b.uid); const f = document.querySelector(`[data-blk="${b.uid}"] textarea, [data-blk="${b.uid}"] input`); if (f) f.focus({preventScroll:true}); if (el.dataset.type==='photos'){ photoTarget=b.uid; $('#fileIn').click(); } },
  'blk-up'(el){ moveBlock(el.dataset.uid,-1); },
  'blk-down'(el){ moveBlock(el.dataset.uid,1); },
  'blk-del'(el){
    const b = findBlock(el.dataset.uid); const has = (b.text||b.url||b.label||(b.images&&b.images.length));
    const go = () => { const ed=state.ed; ed.blocks = ed.blocks.filter(x=>x!==b); if(!ed.blocks.length) ed.blocks.push(mkBlock('text')); ed.dirty=true; rerenderEditor(); };
    if (!has) go(); else ask({ title:'Borrar bloque', text:'Se va a quitar este bloque de la entrada.', ok:'Borrar', danger:true }).then(y => { if (y) go(); });
  },
  'fmt'(el){
    const b = findBlock(el.dataset.uid), ta = document.querySelector(`textarea[data-uid="${b.uid}"]`), w = el.dataset.w;
    const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value, sel = v.slice(s,e) || 'texto';
    ta.value = v.slice(0,s) + w + sel + w + v.slice(e); b.text = ta.value; state.ed.dirty = true;
    ta.focus(); ta.setSelectionRange(s+w.length, s+w.length+sel.length); autoGrow(ta); scheduleDraft();
  },
  'add-photos'(el){ photoTarget = el.dataset.uid; $('#fileIn').click(); },
  'take-photo'(el){ photoTarget = el.dataset.uid; $('#camIn').click(); },
  'img-del'(el){ const b=findBlock(el.dataset.uid); const [im]=b.images.splice(+el.dataset.k,1); if(im && im.preview) URL.revokeObjectURL(im.preview); state.ed.dirty=true; rerenderEditor(); },
  'img-left'(el){ const b=findBlock(el.dataset.uid), k=+el.dataset.k; if(k>0){ [b.images[k-1],b.images[k]]=[b.images[k],b.images[k-1]]; state.ed.dirty=true; rerenderEditor(); } },
  'img-right'(el){ const b=findBlock(el.dataset.uid), k=+el.dataset.k; if(k<b.images.length-1){ [b.images[k+1],b.images[k]]=[b.images[k],b.images[k+1]]; state.ed.dirty=true; rerenderEditor(); } },
  'img-cover'(el){ const b=findBlock(el.dataset.uid); state.ed.coverUid = b.images[+el.dataset.k].uid; state.ed.dirty=true; rerenderEditor(); toast('Esa será la portada'); },
  'preview'(){ previewAction(); },
  'publish'(){ savePostAction(); },
  'add-link'(){ readSettingsForm(); const s=state.settingsDraft; s.links=(s.links||[]).concat([{label:'',url:''}]); render(); },
  'del-link'(el){ readSettingsForm(); const s=state.settingsDraft; s.links.splice(+el.dataset.i,1); render(); },
  'pick-avatar'(){ $('#avatarIn').click(); },
  'rm-avatar'(){ readSettingsForm(); const s=state.settingsDraft; if(!s._oldAvatar) s._oldAvatar=state.site.avatar||''; s.avatar=''; s._avatarBlob=null; s._avatarPreview=''; s._avatarRemoved=true; render(); },
  'save-settings'(){ saveSettingsAction(); },
  'remove-collab'(el){
    const u = el.dataset.user;
    ask({ title:'Quitar colaborador', text:`${u} va a perder el acceso para editar este blog.`, ok:'Quitar', danger:true }).then(y => { if (y) removeCollaboratorAction(u); });
  },
  'cancel-invite'(el){ cancelInviteAction(el.dataset.id); }
};
function moveBlock(id, d){
  const ed = state.ed, i = ed.blocks.findIndex(b => b.uid===id), j = i+d;
  if (j<0 || j>=ed.blocks.length) return;
  [ed.blocks[i], ed.blocks[j]] = [ed.blocks[j], ed.blocks[i]]; ed.dirty = true; rerenderEditor(id);
}
function leaveEditorThen(fn){
  if (state.view==='editor' && state.ed && state.ed.dirty){
    saveDraft();
    ask({ title:'¿Salir de la entrada?', text:'Tenés cambios sin publicar. Guardamos el texto como borrador en este dispositivo, pero las fotos nuevas se pierden.', ok:'Salir igual', cancel:'Seguir editando' }).then(y => { if (y){ state.ed.dirty=false; state.ed=null; fn(); } });
  } else { if (state.view==='editor') state.ed = null; fn(); }
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || !actions[a.dataset.act]) return;
  if (a.tagName==='A') return;
  e.preventDefault(); actions[a.dataset.act](a, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.bind && state.ed){
    const ed = state.ed; ed.dirty = true;
    const k = t.dataset.bind;
    if (k==='title') ed.title = t.value;
    else if (k==='date') ed.date = t.value;
    else if (k==='tagDraft'){ ed.tagDraft = t.value; if (/,$/.test(t.value)){ addTag(t.value); rerenderEditor(); const n=$('#edTag'); if(n) n.focus(); } return; }
    else if (k==='caption'){ const b = findBlock(t.dataset.uid); b.images[+t.dataset.k].caption = t.value; }
    else { const b = findBlock(t.dataset.uid); b[k] = t.value; if (t.tagName==='TEXTAREA') autoGrow(t); }
    scheduleDraft();
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id==='edTag' && (e.key==='Enter')){ e.preventDefault(); if (e.target.value.trim()){ addTag(e.target.value); rerenderEditor(); const n=$('#edTag'); if(n) n.focus(); } }
  else if (e.target.id==='edTag' && e.key==='Backspace' && !e.target.value && state.ed.tags.length){ state.ed.tags.pop(); rerenderEditor(); const n=$('#edTag'); if(n) n.focus(); }
  if (e.key==='Escape'){ const m=$('#modal .overlay'); if (m && m.querySelector('[data-r="0"]')) m.querySelector('[data-r="0"]').click(); }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id==='tokenForm'){
    const tk = $('#tokenIn').value.trim(); const er = $('#connErr'); er.hidden = true;
    if (!tk){ er.textContent='Pegá tu llave de acceso para continuar.'; er.hidden=false; return; }
    const b = $('#connBtn'); b.disabled = true; b.textContent = 'Verificando…';
    try {
      await connect(tk);
      if (state.user){ if ($('#rememberIn') ? $('#rememberIn').checked : true) LS.set('rb.token', tk); }
    } catch(err){
      if (state.view==='connect'){ er.textContent = err.message==='Falta el permiso repo' ? 'Esa llave no tiene el permiso "repo". Generá una nueva con el botón del paso 2 y dejá la casilla tildada.' : errText(err); er.hidden=false; b.disabled=false; b.textContent='Conectar'; }
      else await notice('Algo salió mal', esc(errText(err)));
    }
  } else if (e.target.id==='createForm'){ createBlog(); }
  else if (e.target.id==='openForm'){
    const v = $('#oAddr').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''); const er = $('#openErr');
    if (!/^[\w.-]+\/[\w.-]+$/.test(v)){ er.textContent='Escribilo así: usuario/repositorio'; er.hidden=false; return; }
    er.hidden = true; const [o,r] = v.split('/'); openBlogGuarded(o,r);
  } else if (e.target.id==='collabForm'){
    inviteCollaboratorAction($('#collabUser').value);
  }
});
/* arrastrar fotos (compu) */
document.addEventListener('dragover', e => { const z=e.target.closest('[data-drop]'); if (z){ e.preventDefault(); z.querySelector('.addphoto') && z.querySelector('.addphoto').classList.add('drag'); } });
document.addEventListener('dragleave', e => { const z=e.target.closest('[data-drop]'); if (z && z.querySelector('.addphoto')) z.querySelector('.addphoto').classList.remove('drag'); });
document.addEventListener('drop', e => { const z=e.target.closest('[data-drop]'); if (z){ e.preventDefault(); photoTarget=z.dataset.drop; handleFiles(e.dataTransfer.files); } });
window.addEventListener('beforeunload', e => { if (state.ed && state.ed.dirty){ e.preventDefault(); e.returnValue=''; } });

/* ---------- arranque ---------- */
(async function init(){
  applyUiTheme(LS.get('rb.uiTheme', 'norton'));
  const tk = LS.get('rb.token', '');
  if (!tk){ setView('connect'); return; }
  try { await connect(tk, true); }
  catch(e){
    if (e instanceof GHError && e.status===401){ LS.del('rb.token'); setView('connect'); const er=$('#connErr'); if(er){ er.textContent='Tu llave guardada ya no funciona. Pegá una nueva.'; er.hidden=false; } }
    else if (e instanceof GHError && e.status===0){ setView('connect'); const er=$('#connErr'); if(er){ er.textContent=errText(e); er.hidden=false; } }
    else { if (state.user) { await loadBlogList().catch(()=>{}); setView('blogs'); } else setView('connect'); }
  }
})();
</script></body></html>
